{% extends 'base.html' %}

{% block title %}Strucuted Data{% endblock title %}

{% block body %}
<div class="container py-4">
    <h1 class="text-center">Structured Data</h1>
    <select class="form-select form-select-sm" aria-label=".form-select-sm example">
        <option selected>Open this select menu</option>
        <option value="1">One</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
        <option value="4">Three</option>
      </select>
    </div>

<div class="container py-4">    
    <form class="was-validated">
        <div class="mb-3"> 
            <input id="files" name="files" type="file" class="file"  data-show-upload="false" data-show-caption="true" multiple>
        </div>
    
        <div class="mb-3">
            <button class="btn btn-primary" type="submit">Submit</button>
        </div>
    </form>
</div>

<div class="container py-4"> 
<div class="input-group mb-4">
    <span class="input-group-text">Input</span>
    <textarea class="form-control" rows="5"></textarea>
  </div>

  <input class="btn btn-primary" type="button" value="Input">
</div>

<div class="container py-4">
    <span class="input-group-text input-lg">Output</span>
    <input class="form-control" type="text" value="Output here" aria-label="readonly input example" readonly>
</div> 


{% endblock body %}

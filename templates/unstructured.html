{% extends 'base.html' %}

{% block title %}Unstrucuted Data{% endblock title %}

{% block body %}
<div class="container py-4">
    <h1 class="text-center">Unstructured Data</h1>
    <select class="form-select form-select-sm" aria-label=".form-select-sm example">
        <option selected>Open this select menu</option>
        <option value="1">One</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
        <option value="4">Three</option>
      </select>
    </div>

    <div class="container py-4">
    <form action="{% url 'fileapp:uploads' %}" method="POST" enctype="multipart/form-data">
        <input type="text" name="filename"  placeholder="enter your file name" >
        <input type="file" multiple name="uploadfiles" >
        {% csrf_token %}
        <button class="btn btn-primary" type="submit">File Upload</button>
    </form>
    </div>

<div class="container py-4"> 
<div class="input-group mb-4">
    <span class="input-group-text">Input</span>
    <textarea class="form-control" rows="5"></textarea>
  </div>

  <input class="btn btn-primary" type="button" value="Input">
</div>

<div class="container py-4">
    <span class="input-group-text input-lg">Output</span>
    <input class="form-control" type="text" value="Output here..." aria-label="readonly input example" readonly>
</div>    


{% endblock body %}
